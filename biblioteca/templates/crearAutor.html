{% extends "base.html" %}

{% block content %}

<div class="container mt-5">
    <div class="offset-1 container mx-5">

        <form method="POST" action="{% url 'crearAutor' %}">
            {% csrf_token %}

            <div class="mb-3 mt-1">
                <label for="nombre" class="form-label">Name</label>

                <input
                    type="text"
                    class="form-control"
                    name="nombre"
                    id="nombre"
                    placeholder="Nombre"
                    required
                >
            </div>

            <div class="mb-4 mt-1">
                <label for="lugar" class="form-label">Lugar de Nacimiento</label>

                <input
                    type="text"
                    class="form-control"
                    name="lugar"
                    id="lugar"
                    placeholder="lugar"
                    required
                >
            </div>

            <div class="mb-4 mt-1">
                <label for="fecha" class="form-label">Fecha de Nacimiento</label>

                <input
                    type="datetime-local"
                    class="form-control"
                    name="fecha"
                    id="fecha"
                    required
                >
            </div>

            <input
                type="submit"
                class="btn btn-success"
                value="Enviar"
            >

        </form>

    </div>
</div>

{% endblock content %}
